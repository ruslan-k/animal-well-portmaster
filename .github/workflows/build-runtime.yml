          Run:
            cd /mnt/SDCARD/Roms/PORTS/animalwell
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/wrapper-logoff-delta && zip -qr ../Animal-Well-TSPS-test15-WRAPPER-LOGOFF-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-WRAPPER-LOGOFF-DELTA.zip > Animal-Well-TSPS-test15-WRAPPER-LOGOFF-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-WRAPPER-LOGOFF-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-WRAPPER-LOGOFF-DELTA.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: animalwell-test15-wrapper-logoff-delta
          path: |
            dist/Animal-Well-TSPS-test15-WRAPPER-LOGOFF-DELTA.zip
            dist/Animal-Well-TSPS-test15-WRAPPER-LOGOFF-DELTA.sha256
          if-no-files-found: error


  build-test13-direct-vkd3d:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      MAX_GLIBC: '2.31'
      MAX_GLIBCXX: '3.4.28'
    steps:
      - name: Install Focal build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          printf '%s\n' 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl xz-utils make cmake pkg-config gcc g++ bison flex \
            libjson-perl wine64-tools libvulkan-dev libx11-dev libxcb1-dev libxext-dev \
            file binutils

      - uses: actions/checkout@v4

      - name: Install current Vulkan and SPIR-V headers
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
          git clone -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          mkdir -p /opt/khronos/include
          cp -a /tmp/Vulkan-Headers/include/. /opt/khronos/include/
          cp -a /tmp/SPIRV-Headers/include/. /opt/khronos/include/
          test -f /opt/khronos/include/vulkan/vulkan.h
          test -d /opt/khronos/include/spirv

      - name: Build standalone vkd3d 2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/vkd3d-2.1.tar.xz \
            https://dl.winehq.org/vkd3d/source/vkd3d-2.1.tar.xz
          tar -xJf /tmp/vkd3d-2.1.tar.xz -C /tmp
          cd /tmp/vkd3d-2.1
          CPPFLAGS="-I/opt/khronos/include" \
            ./configure --prefix=/opt/vkd3d --disable-tests --disable-demos
          make -j4
          make install

      - name: Build direct VKD3D probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/test13/lib
          pc=
          for d in /opt/vkd3d/lib/pkgconfig /opt/vkd3d/lib64/pkgconfig; do
            [ -f "$d/libvkd3d.pc" ] && pc="$d" && break
          done
          [ -n "$pc" ] || { echo "libvkd3d.pc not found" >&2; find /opt/vkd3d -maxdepth 4 -type f -print; exit 2; }
          export PKG_CONFIG_PATH="$pc"
          gcc -O2 -Wall -Wextra -o dist/test13/vkd3d_direct_probe \
            scripts/vkd3d_direct_probe.c $(pkg-config --cflags --libs libvkd3d)
          gcc -O2 -Wall -Wextra -o dist/test13/vulkan_ext_probe_x64 \
            scripts/vulkan_ext_probe_x64.c -ldl
          cp -a /opt/vkd3d/lib*/libvkd3d.so* dist/test13/lib/ 2>/dev/null || true
          cp -a /opt/vkd3d/lib*/libvkd3d-shader.so* dist/test13/lib/ 2>/dev/null || true
          cp -a /opt/vkd3d/lib*/libvkd3d-utils.so* dist/test13/lib/ 2>/dev/null || true
          test -x dist/test13/vkd3d_direct_probe
          test -x dist/test13/vulkan_ext_probe_x64
          test -e dist/test13/lib/libvkd3d.so.1
          file dist/test13/vkd3d_direct_probe dist/test13/vulkan_ext_probe_x64 dist/test13/lib/*.so*
          file dist/test13/vulkan_ext_probe_x64 | grep -q 'x86-64'
          ldd dist/test13/vkd3d_direct_probe | tee dist/test13/ldd.txt
          readelf -d dist/test13/vkd3d_direct_probe > dist/test13/readelf.txt
          printf 'vkd3d=2.1\nmode=direct-no-wine-no-dxgi-no-wsi\nbuild_glibc=2.31\n' > dist/test13/MANIFEST.txt

      - name: Validate test13 ABI
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-abi.sh dist/test13 2>&1 | tee dist/test13/abi-report.txt

      - name: Host smoke for binary/linkage only
        shell: bash
        run: |
          set +e
          LD_LIBRARY_PATH="$PWD/dist/test13/lib" VKD3D_DEBUG=info \
            ./dist/test13/vkd3d_direct_probe >dist/test13/host-run.log 2>&1
          echo "host_exit=$?" >>dist/test13/host-run.log
          cat dist/test13/host-run.log
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: animalwell-test13-direct-vkd3d
          path: dist/test13
          if-no-files-found: error


  build-test14-mali-wsi-wrapper:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      MAX_GLIBC: '2.31'
      MAX_GLIBCXX: '3.4.28'
    steps:
      - name: Configure amd64 + arm64 Focal repositories
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cat >/etc/apt/sources.list <<'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal-updates main universe
          deb [arch=amd64] http://security.ubuntu.com/ubuntu focal-security main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe
          EOF
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake make pkg-config python3 file binutils zip unzip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
            wayland-protocols libwayland-bin \
            libvulkan-dev:arm64 libx11-dev:arm64 libx11-xcb-dev:arm64 \
            libxext-dev:arm64 libxrandr-dev:arm64 \
            libxcb1-dev:arm64 libxcb-dri3-dev:arm64 libxcb-present-dev:arm64 \
            libxcb-shm0-dev:arm64 libxcb-sync-dev:arm64 \
            libdrm-dev:arm64 libwayland-dev:arm64

      - uses: actions/checkout@v4

      - name: Stage current Vulkan headers
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
          mkdir -p /opt/khronos/include /opt/khronos/lib/pkgconfig
          cp -a /tmp/Vulkan-Headers/include/. /opt/khronos/include/
          mkdir -p /opt/khronos/include/linux
          cat >/opt/khronos/include/linux/dma-heap.h <<'EOF'
          /* SPDX-License-Identifier: GPL-2.0 WITH Linux-syscall-note */
          #ifndef _UAPI_LINUX_DMABUF_POOL_H
          #define _UAPI_LINUX_DMABUF_POOL_H
          #include <linux/ioctl.h>
          #include <linux/types.h>
          #define DMA_HEAP_VALID_FD_FLAGS (O_CLOEXEC | O_ACCMODE)
          #define DMA_HEAP_VALID_HEAP_FLAGS (0ULL)
          struct dma_heap_allocation_data {
              __u64 len;
              __u32 fd;
              __u32 fd_flags;
              __u64 heap_flags;
          };
          #define DMA_HEAP_IOC_MAGIC 'H'
          #define DMA_HEAP_IOCTL_ALLOC _IOWR(DMA_HEAP_IOC_MAGIC, 0x0, struct dma_heap_allocation_data)
          #endif
          EOF
          cat >/opt/khronos/lib/pkgconfig/vulkan.pc <<'EOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/lib/aarch64-linux-gnu
          includedir=/opt/khronos/include

          Name: Vulkan-Loader
          Description: Vulkan Loader
          Version: 1.3.296
          Libs: -L${libdir} -lvulkan
          Cflags: -I${includedir}
          EOF

      - name: Cross-build Mali WSI wrapper
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/zeyadadev/mali-vulkan-icd-wrapper.git /tmp/mali-wrapper
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/mali-wrapper/src/wsi/x11/drm_display.cpp')
          s=p.read_text()
          pat=r'static bool fill_supported_formats_with_modifiers\(.*?\n\}\n\nstd::optional<drm_display>'
          repl="static bool fill_supported_formats_with_modifiers(uint32_t primary_plane_index, const util::fd_owner &drm_fd,\\n                                                   const drm_plane_resources_owner &plane_res,\\n                                                   util::vector<drm_format_pair> &supported_formats)\\n{\\n    (void)primary_plane_index;\\n    (void)drm_fd;\\n    (void)plane_res;\\n    (void)supported_formats;\\n    return false;\\n}\\n\\nstd::optional<drm_display>"
          ns,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('failed to patch old-libdrm modifier path')
          p.write_text(ns)

          p=Path('/tmp/mali-wrapper/src/wsi/x11/swapchain.cpp')
          s=p.read_text()
          old=('   WSIALLOC_ASSERT_VERSION();\n'
               '   if (wsialloc_new(&m_wsi_allocator) != WSIALLOC_ERROR_NONE)\n'
               '   {\n'
               '      WSI_LOG_ERROR("Failed to create wsi allocator.");\n'
               '      return VK_ERROR_INITIALIZATION_FAILED;\n'
               '   }\n'
               '\n'
               '   const bool force_shm = env_var_is_enabled(std::getenv("WSI_X11_FORCE_SHM"));\n'
               '   const bool force_bridge = env_var_is_enabled(std::getenv("WSI_X11_FORCE_BRIDGE"));')
          new=('   const bool force_shm = env_var_is_enabled(std::getenv("WSI_X11_FORCE_SHM"));\n'
               '\n'
               '   /* Forced SHM does not use wsialloc/DMA-BUF memory. */\n'
               '   if (!force_shm)\n'
               '   {\n'
               '      WSIALLOC_ASSERT_VERSION();\n'
               '      if (wsialloc_new(&m_wsi_allocator) != WSIALLOC_ERROR_NONE)\n'
               '      {\n'
               '         WSI_LOG_ERROR("Failed to create wsi allocator.");\n'
               '         return VK_ERROR_INITIALIZATION_FAILED;\n'
               '      }\n'
               '   }\n'
               '   else\n'
               '   {\n'
               '      WSI_LOG_INFO("WSI_X11_FORCE_SHM: skipping unused wsialloc/DMA-BUF allocator initialization.");\n'
               '   }\n'
               '\n'
               '   const bool force_bridge = env_var_is_enabled(std::getenv("WSI_X11_FORCE_BRIDGE"));')
          if old not in s:
              start=s.find('WSIALLOC_ASSERT_VERSION()')
              raise SystemExit('failed to patch X11 wsialloc init block; nearby='+repr(s[start:start+500]))
          p.write_text(s.replace(old,new,1))
          PY
          cat >/tmp/aarch64-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_LIBRARY_ARCHITECTURE aarch64-linux-gnu)
          EOF
          export PKG_CONFIG_LIBDIR=/opt/khronos/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_PATH=
          cmake -S /tmp/mali-wrapper -B /tmp/mali-wrapper-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/aarch64-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCURRENT_ARCH=aarch64 \
            -DBUILD_64BIT=ON -DBUILD_32BIT=OFF \
            -DBUILD_HUD=OFF -DBUILD_TESTING=OFF -DINSTALL_ICDS=OFF \
            -DBUILD_WSI_X11=ON -DBUILD_WSI_WAYLAND=OFF -DBUILD_WSI_HEADLESS=ON \
            -DENABLE_WAYLAND_FIFO_PRESENTATION_THREAD=OFF \
            -DMALI_DRIVER_PATH_64=libmali.so.0 \
            -DVULKAN_REGISTRY_XML=/tmp/Vulkan-Headers/registry/vk.xml
          cmake --build /tmp/mali-wrapper-build -j4

      - name: Cross-build Xlib WSI probe
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_LIBDIR=/opt/khronos/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          mkdir -p dist/test14/lib
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -DVK_USE_PLATFORM_XLIB_KHR \
            -I/opt/khronos/include \
            -o dist/test14/vk_wsi_xlib_probe scripts/vk_wsi_xlib_probe.c \
            -L/usr/lib/aarch64-linux-gnu -lvulkan -lX11
          wrapper=$(find /tmp/mali-wrapper-build -type f -name 'libmali_wrapper.so*' | head -1)
          test -n "$wrapper"
          cp -L "$wrapper" dist/test14/lib/libmali_wrapper.so
          ln -s libmali_wrapper.so dist/test14/lib/libmali_wrapper.so.1
          aarch64-linux-gnu-strip dist/test14/vk_wsi_xlib_probe dist/test14/lib/libmali_wrapper.so

      - name: Collect ARM64 runtime dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/test14/deps
          python3 - <<'PY'
          import os, re, subprocess, shutil
          roots=['/usr/lib/aarch64-linux-gnu','/lib/aarch64-linux-gnu','/usr/aarch64-linux-gnu/lib']
          queue=['dist/test14/vk_wsi_xlib_probe','dist/test14/lib/libmali_wrapper.so']
          seen=set()
          skip={'libc.so.6','libm.so.6','libdl.so.2','libpthread.so.0','librt.so.1','ld-linux-aarch64.so.1','libmali.so.0'}
          def needed(path):
              out=subprocess.check_output(['aarch64-linux-gnu-readelf','-d',path],text=True,errors='replace')
              return re.findall(r'\(NEEDED\).*?\[(.*?)\]',out)
          while queue:
              p=queue.pop()
              for n in needed(p):
                  if n in skip or n in seen: continue
                  src=next((os.path.join(r,n) for r in roots if os.path.exists(os.path.join(r,n))),None)
                  if not src:
                      print('MISSING_DEP',n,'needed_by',p)
                      continue
                  dst=os.path.join('dist/test14/deps',n)
                  shutil.copy2(os.path.realpath(src),dst)
                  seen.add(n); queue.append(dst)
          print('COPIED_DEPS',*sorted(seen),sep='\n')
          PY
          aarch64-linux-gnu-strip dist/test14/deps/*.so* 2>/dev/null || true
          file dist/test14/vk_wsi_xlib_probe dist/test14/lib/libmali_wrapper.so dist/test14/deps/*

      - name: Write manifest and validate ABI
        shell: bash
        run: |
          set -euo pipefail
          cat >dist/test14/mali_wrapper_icd.json <<'EOF'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "lib/libmali_wrapper.so",
              "api_version": "1.3.276"
            }
          }
          EOF
          printf 'mode=mali-wrapper-xlib-wsi\nwrapper=zeyadadev/mali-vulkan-icd-wrapper\nforce_presenter=SHM\nmali_driver=libmali.so.0-via-LD_LIBRARY_PATH\n' >dist/test14/MANIFEST.txt
          bash scripts/check-abi.sh dist/test14 2>&1 | tee dist/test14/abi-report.txt

      - name: Build installable TSPS test14/test15 patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=dist/test14-device/animalwell
          mkdir -p "$PATCH/runtime/test14"
          cp -a dist/test14/. "$PATCH/runtime/test14/"
          cp package/animalwell/test14-15-wsi.sh "$PATCH/test14-15-wsi.sh"
          chmod +x "$PATCH/test14-15-wsi.sh" "$PATCH/runtime/test14/vk_wsi_xlib_probe"
          cat >"$PATCH/TEST14-15-README.txt" <<'EOF'
          ANIMAL WELL TSPS WSI field patch

          Overlay the animalwell/ directory onto the existing port.

          Run native WSI test first:
            ./test14-15-wsi.sh test14

          Only if test14 reports PASS_XLIB_SWAPCHAIN, run Wine integration:
            ./test14-15-wsi.sh test15

          Neither mode launches Animal Well itself.
          Logs are written under animalwell/logs/.
          EOF
          (cd dist/test14-device && zip -qr ../Animal-Well-TSPS-test14-15-PATCH.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test14-15-PATCH.zip > Animal-Well-TSPS-test14-15-PATCH.sha256)
          unzip -l dist/Animal-Well-TSPS-test14-15-PATCH.zip
          cat dist/Animal-Well-TSPS-test14-15-PATCH.sha256

      - name: Build delta-only Xorg fix patch
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test14-xorg-fix/animalwell
          mkdir -p "$D"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST14-15-XORG-FIX.txt" <<'EOF'
          Delta over the previous test14/test15 patch.
          Only the field harness changed.

          This revision:
          - auto-detects the proven Totono private Xorg at /mnt/UDISK/xorg/usr/lib/xorg/Xorg
          - uses the known Xorg library roots under /mnt/UDISK/xorg-libs
          - reuses Totono's totono-fb.conf when present
          - falls back to the generated fbdev config/system Xorg search
          - logs all selected Xorg paths
          - exports SDL_VIDEODRIVER=x11 after DISPLAY becomes usable
          EOF
          (cd dist/test14-xorg-fix && zip -qr ../Animal-Well-TSPS-test14-15-XORG-FIX.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test14-15-XORG-FIX.zip > Animal-Well-TSPS-test14-15-XORG-FIX.sha256)
          unzip -l dist/Animal-Well-TSPS-test14-15-XORG-FIX.zip
          cat dist/Animal-Well-TSPS-test14-15-XORG-FIX.sha256

      - name: Build delta-only forced-SHM allocator fix
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test14-shm-alloc-fix/animalwell
          mkdir -p "$D/runtime/test14/lib"
          cp dist/test14/lib/libmali_wrapper.so "$D/runtime/test14/lib/libmali_wrapper.so"
          cat >"$D/TEST14-SHM-ALLOC-FIX.txt" <<'EOF'
          Delta over the previous test14/test15 + Xorg-fix patches.

          Only the Mali wrapper binary changed.

          Fix:
          - when WSI_X11_FORCE_SHM=1, skip wsialloc_new()
          - the forced SHM path does not use DMA-BUF/wsialloc
          - this avoids a false failure when /dev/dma_heap/system-uncached is absent
          - DRI3/bridge behavior is unchanged and still requires wsialloc

          Re-run:
            ./test14-15-wsi.sh test14

          Only run test15 after:
            TEST14_RESULT=PASS_XLIB_SWAPCHAIN
          EOF
          (cd dist/test14-shm-alloc-fix && zip -qr ../Animal-Well-TSPS-test14-SHM-ALLOC-FIX.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test14-SHM-ALLOC-FIX.zip > Animal-Well-TSPS-test14-SHM-ALLOC-FIX.sha256)
          unzip -l dist/Animal-Well-TSPS-test14-SHM-ALLOC-FIX.zip
          cat dist/Animal-Well-TSPS-test14-SHM-ALLOC-FIX.sha256

      - name: Build delta-only SHM env/identity diagnostic
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test14-shm-env-diag/animalwell
          mkdir -p "$D"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST14-SHM-ENV-DIAG.txt" <<'EOF'
          Delta over the previous test14 patches.

          Only the field harness changed.

          This revision:
          - logs WSI_X11_FORCE_SHM
          - logs wrapper SHA-256 when sha256sum is available
          - requires the new SHM-bypass marker in libmali_wrapper.so
          - exits with code 22 if a stale wrapper is installed
          - invokes the native probe through explicit env WSI_X11_FORCE_SHM=1
            plus the exact VK_ICD_FILENAMES and LD_LIBRARY_PATH values

          Re-run:
            ./test14-15-wsi.sh test14
          EOF
          (cd dist/test14-shm-env-diag && zip -qr ../Animal-Well-TSPS-test14-SHM-ENV-DIAG.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test14-SHM-ENV-DIAG.zip > Animal-Well-TSPS-test14-SHM-ENV-DIAG.sha256)
          unzip -l dist/Animal-Well-TSPS-test14-SHM-ENV-DIAG.zip
          cat dist/Animal-Well-TSPS-test14-SHM-ENV-DIAG.sha256

      - name: Build delta-only persistent Wine/X11 harness
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-persistent-x11/animalwell
          mkdir -p "$D"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST15-PERSISTENT-X11-DELTA.txt" <<'EOF'
          Delta over the previous test15 Box64 A/B patch.

          Only the field harness changed. No runtime binaries are replaced.

          Changes:
          - always discovers the known Totono/private-Xorg ARM64 library roots,
            even when DISPLAY=:1 already exists
          - exposes those roots to Wine LD_LIBRARY_PATH, not only to Xorg
          - enables Mali wrapper DEBUG logging
          - keeps one wineserver alive across all staged smoke tests
          - watchdog kills only the stuck smoke process, avoiding repeated
            wineboot/explorer initialization between stages
          - prefix sanity is retried and no longer aborts all diagnostics if
            cmd.exe is killed after the template prefix already initialized
          - removes the now-disproven Box64 main A/B from the field sequence

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-persistent-x11 && zip -qr ../Animal-Well-TSPS-test15-PERSISTENT-X11-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-PERSISTENT-X11-DELTA.zip > Animal-Well-TSPS-test15-PERSISTENT-X11-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-PERSISTENT-X11-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-PERSISTENT-X11-DELTA.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: animalwell-test14-mali-wsi-wrapper
          path: |
            dist/test14
            dist/Animal-Well-TSPS-test14-15-PATCH.zip
            dist/Animal-Well-TSPS-test14-15-PATCH.sha256
            dist/Animal-Well-TSPS-test14-15-XORG-FIX.zip
            dist/Animal-Well-TSPS-test14-15-XORG-FIX.sha256
            dist/Animal-Well-TSPS-test14-SHM-ALLOC-FIX.zip
            dist/Animal-Well-TSPS-test14-SHM-ALLOC-FIX.sha256
            dist/Animal-Well-TSPS-test14-SHM-ENV-DIAG.zip
            dist/Animal-Well-TSPS-test14-SHM-ENV-DIAG.sha256
            dist/Animal-Well-TSPS-test15-PERSISTENT-X11-DELTA.zip
            dist/Animal-Well-TSPS-test15-PERSISTENT-X11-DELTA.sha256
          if-no-files-found: error


  build-test15-box64-main:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      BOX64_TEST15_REF: c61543e47b8a9d1720742186bfea205ad8a7ed35
      MAX_GLIBC: '2.31'
      MAX_GLIBCXX: '3.4.28'
    steps:
      - name: Install Focal build dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends             ca-certificates git make python3 python3-pip             gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross             file zip unzip
          python3 -m pip install --no-cache-dir 'cmake==3.27.9'

      - uses: actions/checkout@v4

      - name: Build pinned post-v0.4.4 Box64 candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/ptitSeb/box64.git /tmp/box64-main
          git -C /tmp/box64-main checkout -q "$BOX64_TEST15_REF"
          cat >/tmp/box64-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          EOF
          /usr/local/bin/cmake -S /tmp/box64-main -B /tmp/box64-main-build             -DCMAKE_TOOLCHAIN_FILE=/tmp/box64-toolchain.cmake             -DARM64=1 -DBOX32=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          /usr/local/bin/cmake --build /tmp/box64-main-build -j4
          mkdir -p dist/test15-box64-main
          cp /tmp/box64-main-build/box64 dist/test15-box64-main/box64-test15-main
          aarch64-linux-gnu-strip dist/test15-box64-main/box64-test15-main
          file dist/test15-box64-main/box64-test15-main
          strings dist/test15-box64-main/box64-test15-main | grep -F 'BOX64_MMAP32' | head -1 || true

      - name: Validate Box64 candidate ABI
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-abi.sh dist/test15-box64-main 2>&1 | tee dist/test15-box64-main/abi-report.txt
          aarch64-linux-gnu-readelf --version-info dist/test15-box64-main/box64-test15-main             > dist/test15-box64-main/version-info.txt 2>&1 || true

      - name: Build delta-only Box64 A/B patch
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-box64-main-delta/animalwell
          mkdir -p "$D/runtime/box64"
          cp dist/test15-box64-main/box64-test15-main "$D/runtime/box64/box64-test15-main"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh" "$D/runtime/box64/box64-test15-main"
          cat >"$D/TEST15-BOX64-MAIN-DELTA.txt" <<'EOF'
          Delta over the previous test15 staged diagnostics.

          Adds a separate Box64 candidate built from:
            c61543e47b8a9d1720742186bfea205ad8a7ed35
          (post-v0.4.4 main, 2026-09-27)

          Production runtime/box64/box64 is NOT replaced.

          Relevant upstream changes after v0.4.4 include:
          - #4303: do not allocate bridge bricks in guest low memory for 64-bit guests
          - #4377: limit MAP_NORESERVE length on 39-bit platforms
          - #4394: fix race between concurrent mmaps overwriting guest mappings

          The harness first probes load-dxgi with release v0.4.4, then with the
          candidate, using an explicit watchdog. If the candidate gets past
          load-dxgi, it continues load-d3d12/factory/device/all with the candidate.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-box64-main-delta && zip -qr ../Animal-Well-TSPS-test15-BOX64-MAIN-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-BOX64-MAIN-DELTA.zip > Animal-Well-TSPS-test15-BOX64-MAIN-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-BOX64-MAIN-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-BOX64-MAIN-DELTA.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: animalwell-test15-box64-main
          path: |
            dist/test15-box64-main
            dist/Animal-Well-TSPS-test15-BOX64-MAIN-DELTA.zip
            dist/Animal-Well-TSPS-test15-BOX64-MAIN-DELTA.sha256
          if-no-files-found: error
