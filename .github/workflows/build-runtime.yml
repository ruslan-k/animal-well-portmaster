          Revision 2026-09-28.17:
          - disables mali-wrapper C++ logging before the Box64/native Vulkan bridge
          - avoids Logger::Log() stringstream/std::cout after .16 proved the crash
            lands in libstdc++ std::ostream::sentry
          - retries with BOX64_NOVULKANOVERLAY=1 only if log-off alone still fails
          - if the bridge passes, preserves MALI_WRAPPER_LOG_CATEGORY=off for Wine
            and continues to the existing display/D3DKMT/DXGI/D3D12 stages

          Prerequisite:
          - the previous .16 delta is already installed, including
