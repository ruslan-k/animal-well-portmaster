name: build-runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: |
          bash -n scripts/build_runtime.sh
          bash -n scripts/check-abi.sh
          sh -n 'package/Animal Well.sh'
          sh -n 'package/Animal Well Diagnose.sh'
          sh -n package/animalwell/diagnose.sh

      - name: Prove ABI gate fails closed
        run: |
          set -o pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cp /bin/ls "$tmp/too-new-for-zero-ceiling"
          if MAX_GLIBC=0.0 MAX_GLIBCXX=0.0 bash scripts/check-abi.sh "$tmp" 2>&1 | tee "$tmp/negative.log"; then
            echo "ERROR: ABI checker unexpectedly accepted a deliberately impossible ceiling" >&2
            exit 1
          fi
          grep -q 'ABI check: FAIL' "$tmp/negative.log"

  build-aarch64-runtime:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      MAX_GLIBC: '2.31'
      MAX_GLIBCXX: '3.4.28'
    steps:
      - name: Install focal build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          printf '%s\n' 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl xz-utils zstd zip make cmake python3 python3-pip \
            file binutils gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross qemu-user gcc-mingw-w64-x86-64 \
            libvulkan-dev libunwind8 libstdc++6
          python3 -m pip install --no-cache-dir cmake==3.27.9
          cmake --version
          ldd --version | head -n1

      - uses: actions/checkout@v4

      - name: Build
        run: JOBS=4 bash scripts/build_runtime.sh

      - name: Validate every shipped ELF against SpruceOS ABI ceiling
        shell: bash
        run: |
          set -o pipefail
          RT=.work/package/animalwell/runtime
          mkdir -p dist
          bash scripts/check-abi.sh "$RT" 2>&1 | tee dist/abi-report.txt

      - name: Validate formats and ARM64 loader
        shell: bash
        run: |
          set -euo pipefail
          RT=.work/package/animalwell/runtime
          file "$RT/box64/box64" "$RT/tools/vkprobe" "$RT/tools/d3d12_smoke.exe"
          file "$RT/box64/box64" | grep -q 'ARM aarch64'
          file "$RT/tools/vkprobe" | grep -q 'ARM aarch64'
          file "$RT/tools/d3d12_smoke.exe" | grep -q 'PE32+'
          for f in "$RT"/box64/x64lib/*.so*; do
            file "$f"
            file "$f" | grep -q 'x86-64'
          done
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$RT/box64/box64" -v 2>&1 | tee dist/box64-qemu.log

      - name: Validate lightweight Wine prefix layout
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(pwd)/.work/package/animalwell"
          RT="$ROOT/runtime"
          T="$ROOT/prefix-template"
          P=/tmp/animalwell-ci-prefix
          rm -rf "$P"
          mkdir -p "$P/dosdevices" "$P/drive_c/windows" "$P/drive_c/users" \
            "$P/drive_c/Program Files" "$P/drive_c/Program Files (x86)" \
            "$P/drive_c/ProgramData" "$P/drive_c/windows/temp"
          cp "$T/system.reg" "$P/system.reg"
          cp "$T/user.reg" "$P/user.reg"
          cp "$T/userdef.reg" "$P/userdef.reg"
          cp "$T/.update-timestamp" "$P/.update-timestamp"
          ln -s ../drive_c "$P/dosdevices/c:"
          ln -s / "$P/dosdevices/z:"
          ln -s "$RT/wine/lib/wine/x86_64-windows" "$P/drive_c/windows/system32"
          ln -s "$RT/wine/lib/wine/i386-windows" "$P/drive_c/windows/syswow64"
          mkdir -p /tmp/animalwell-ci-user
          ln -s /tmp/animalwell-ci-user "$P/drive_c/users/root"
          test -f "$P/drive_c/windows/system32/kernel32.dll"
          WINEPREFIX="$P" WINEARCH=win64 WINEDEBUG=-all \
            WINEDLLOVERRIDES='winemenubuilder.exe=d;mscoree=d;mshtml=d' \
            "$RT/wine/bin/wine" cmd /c ver 2>&1 | tee dist/prefix-sanity.log
          grep -q 'Microsoft Windows' dist/prefix-sanity.log

      - name: Verify game-free artifact
        run: |
          ! find .work/package -type f \( -iname 'Animal Well.exe' -o -iname '*.nsp' -o -iname 'main' -o -iname 'sdk' \) -print -quit | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: animalwell-portmaster-runtime
          path: |
            dist/animalwell-portmaster-runtime.zip
            dist/SHA256SUMS
            dist/compatibility.txt
            dist/box64-readelf.txt
            dist/box64-glibc-symbols.txt
            dist/abi-report.txt
            dist/box64-qemu.log
            dist/prefix-wineboot.log
            dist/prefix-sanity.log
          if-no-files-found: error


  build-test13-direct-vkd3d:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      MAX_GLIBC: '2.31'
      MAX_GLIBCXX: '3.4.28'
    steps:
      - name: Install Focal build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          printf '%s\n' 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl xz-utils make cmake pkg-config gcc g++ bison flex \
            libjson-perl wine64-tools libvulkan-dev libx11-dev libxcb1-dev libxext-dev \
            file binutils

      - uses: actions/checkout@v4

      - name: Install current Vulkan and SPIR-V headers
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
          git clone -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          mkdir -p /opt/khronos/include
          cp -a /tmp/Vulkan-Headers/include/. /opt/khronos/include/
          cp -a /tmp/SPIRV-Headers/include/. /opt/khronos/include/
          test -f /opt/khronos/include/vulkan/vulkan.h
          test -d /opt/khronos/include/spirv

      - name: Build standalone vkd3d 2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/vkd3d-2.1.tar.xz \
            https://dl.winehq.org/vkd3d/source/vkd3d-2.1.tar.xz
          tar -xJf /tmp/vkd3d-2.1.tar.xz -C /tmp
          cd /tmp/vkd3d-2.1
          CPPFLAGS="-I/opt/khronos/include" \
            ./configure --prefix=/opt/vkd3d --disable-tests --disable-demos
          make -j4
          make install

      - name: Build direct VKD3D probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/test13/lib
          pc=
          for d in /opt/vkd3d/lib/pkgconfig /opt/vkd3d/lib64/pkgconfig; do
            [ -f "$d/libvkd3d.pc" ] && pc="$d" && break
          done
          [ -n "$pc" ] || { echo "libvkd3d.pc not found" >&2; find /opt/vkd3d -maxdepth 4 -type f -print; exit 2; }
          export PKG_CONFIG_PATH="$pc"
          gcc -O2 -Wall -Wextra -o dist/test13/vkd3d_direct_probe \
            scripts/vkd3d_direct_probe.c $(pkg-config --cflags --libs libvkd3d)
          cp -a /opt/vkd3d/lib*/libvkd3d.so* dist/test13/lib/ 2>/dev/null || true
          cp -a /opt/vkd3d/lib*/libvkd3d-shader.so* dist/test13/lib/ 2>/dev/null || true
          cp -a /opt/vkd3d/lib*/libvkd3d-utils.so* dist/test13/lib/ 2>/dev/null || true
          test -x dist/test13/vkd3d_direct_probe
          test -e dist/test13/lib/libvkd3d.so.1
          file dist/test13/vkd3d_direct_probe dist/test13/lib/*.so*
          ldd dist/test13/vkd3d_direct_probe | tee dist/test13/ldd.txt
          readelf -d dist/test13/vkd3d_direct_probe > dist/test13/readelf.txt
          printf 'vkd3d=2.1\nmode=direct-no-wine-no-dxgi-no-wsi\nbuild_glibc=2.31\n' > dist/test13/MANIFEST.txt

      - name: Validate test13 ABI
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-abi.sh dist/test13 2>&1 | tee dist/test13/abi-report.txt

      - name: Host smoke for binary/linkage only
        shell: bash
        run: |
          set +e
          LD_LIBRARY_PATH="$PWD/dist/test13/lib" VKD3D_DEBUG=info \
            ./dist/test13/vkd3d_direct_probe >dist/test13/host-run.log 2>&1
          echo "host_exit=$?" >>dist/test13/host-run.log
          cat dist/test13/host-run.log
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: animalwell-test13-direct-vkd3d
          path: dist/test13
          if-no-files-found: error


  build-test14-mali-wsi-wrapper:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      MAX_GLIBC: '2.31'
      MAX_GLIBCXX: '3.4.28'
    steps:
      - name: Configure amd64 + arm64 Focal repositories
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cat >/etc/apt/sources.list <<'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal-updates main universe
          deb [arch=amd64] http://security.ubuntu.com/ubuntu focal-security main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe
          EOF
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake make pkg-config python3 file binutils \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
            wayland-protocols libwayland-bin \
            libvulkan-dev:arm64 libx11-dev:arm64 libx11-xcb-dev:arm64 \
            libxext-dev:arm64 libxrandr-dev:arm64 \
            libxcb1-dev:arm64 libxcb-dri3-dev:arm64 libxcb-present-dev:arm64 \
            libxcb-shm0-dev:arm64 libxcb-sync-dev:arm64 \
            libdrm-dev:arm64 libwayland-dev:arm64

      - uses: actions/checkout@v4

      - name: Stage current Vulkan headers
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
          mkdir -p /opt/khronos/include /opt/khronos/lib/pkgconfig
          cp -a /tmp/Vulkan-Headers/include/. /opt/khronos/include/
          cat >/opt/khronos/lib/pkgconfig/vulkan.pc <<'EOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/lib/aarch64-linux-gnu
          includedir=/opt/khronos/include

          Name: Vulkan-Loader
          Description: Vulkan Loader
          Version: 1.3.296
          Libs: -L${libdir} -lvulkan
          Cflags: -I${includedir}
          EOF

      - name: Cross-build Mali WSI wrapper
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/zeyadadev/mali-vulkan-icd-wrapper.git /tmp/mali-wrapper
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/mali-wrapper/src/wsi/x11/drm_display.cpp')
          s=p.read_text()
          pat=r'static bool fill_supported_formats_with_modifiers\(.*?\n\}\n\nstd::optional<drm_display>'
          repl="static bool fill_supported_formats_with_modifiers(uint32_t primary_plane_index, const util::fd_owner &drm_fd,\\n                                                   const drm_plane_resources_owner &plane_res,\\n                                                   util::vector<drm_format_pair> &supported_formats)\\n{\\n    (void)primary_plane_index;\\n    (void)drm_fd;\\n    (void)plane_res;\\n    (void)supported_formats;\\n    return false;\\n}\\n\\nstd::optional<drm_display>"
          ns,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('failed to patch old-libdrm modifier path')
          p.write_text(ns)
          PY
          cat >/tmp/aarch64-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_LIBRARY_ARCHITECTURE aarch64-linux-gnu)
          EOF
          export PKG_CONFIG_LIBDIR=/opt/khronos/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_PATH=
          cmake -S /tmp/mali-wrapper -B /tmp/mali-wrapper-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/aarch64-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCURRENT_ARCH=aarch64 \
            -DBUILD_64BIT=ON -DBUILD_32BIT=OFF \
            -DBUILD_HUD=OFF -DBUILD_TESTING=OFF -DINSTALL_ICDS=OFF \
            -DBUILD_WSI_X11=ON -DBUILD_WSI_WAYLAND=OFF -DBUILD_WSI_HEADLESS=ON \
            -DENABLE_WAYLAND_FIFO_PRESENTATION_THREAD=OFF \
            -DMALI_DRIVER_PATH_64=/usr/lib/libmali.so.0 \
            -DVULKAN_REGISTRY_XML=/tmp/Vulkan-Headers/registry/vk.xml
          cmake --build /tmp/mali-wrapper-build -j4

      - name: Cross-build Xlib WSI probe
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_LIBDIR=/opt/khronos/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          mkdir -p dist/test14/lib
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -DVK_USE_PLATFORM_XLIB_KHR \
            -I/opt/khronos/include \
            -o dist/test14/vk_wsi_xlib_probe scripts/vk_wsi_xlib_probe.c \
            -L/usr/lib/aarch64-linux-gnu -lvulkan -lX11
          wrapper=$(find /tmp/mali-wrapper-build -type f -name 'libmali_wrapper.so*' | head -1)
          test -n "$wrapper"
          cp -L "$wrapper" dist/test14/lib/libmali_wrapper.so
          ln -s libmali_wrapper.so dist/test14/lib/libmali_wrapper.so.1
          aarch64-linux-gnu-strip dist/test14/vk_wsi_xlib_probe dist/test14/lib/libmali_wrapper.so

      - name: Collect ARM64 runtime dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/test14/deps
          python3 - <<'PY'
          import os, re, subprocess, shutil
          roots=['/usr/lib/aarch64-linux-gnu','/lib/aarch64-linux-gnu','/usr/aarch64-linux-gnu/lib']
          queue=['dist/test14/vk_wsi_xlib_probe','dist/test14/lib/libmali_wrapper.so']
          seen=set()
          skip={'libc.so.6','libm.so.6','libdl.so.2','libpthread.so.0','librt.so.1','ld-linux-aarch64.so.1','libmali.so.0'}
          def needed(path):
              out=subprocess.check_output(['aarch64-linux-gnu-readelf','-d',path],text=True,errors='replace')
              return re.findall(r'\(NEEDED\).*?\[(.*?)\]',out)
          while queue:
              p=queue.pop()
              for n in needed(p):
                  if n in skip or n in seen: continue
                  src=next((os.path.join(r,n) for r in roots if os.path.exists(os.path.join(r,n))),None)
                  if not src:
                      print('MISSING_DEP',n,'needed_by',p)
                      continue
                  dst=os.path.join('dist/test14/deps',n)
                  shutil.copy2(os.path.realpath(src),dst)
                  seen.add(n); queue.append(dst)
          print('COPIED_DEPS',*sorted(seen),sep='\n')
          PY
          aarch64-linux-gnu-strip dist/test14/deps/*.so* 2>/dev/null || true
          file dist/test14/vk_wsi_xlib_probe dist/test14/lib/libmali_wrapper.so dist/test14/deps/*

      - name: Write manifest and validate ABI
        shell: bash
        run: |
          set -euo pipefail
          cat >dist/test14/mali_wrapper_icd.json <<'EOF'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "lib/libmali_wrapper.so",
              "api_version": "1.3.276"
            }
          }
          EOF
          printf 'mode=mali-wrapper-xlib-wsi\nwrapper=zeyadadev/mali-vulkan-icd-wrapper\nforce_presenter=SHM\nmali_driver=/usr/lib/libmali.so.0\n' >dist/test14/MANIFEST.txt
          bash scripts/check-abi.sh dist/test14 2>&1 | tee dist/test14/abi-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: animalwell-test14-mali-wsi-wrapper
          path: dist/test14
          if-no-files-found: error
