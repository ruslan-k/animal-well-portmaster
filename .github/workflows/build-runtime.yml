            dist/Animal-Well-TSPS-test15-VDESKTOP-DELTA.sha256
            dist/Animal-Well-TSPS-test15-DISPLAY-SEED-DELTA.zip
            dist/Animal-Well-TSPS-test15-DISPLAY-SEED-DELTA.sha256
