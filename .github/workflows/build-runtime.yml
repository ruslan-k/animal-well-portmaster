name: build-runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: |
          bash -n scripts/build_runtime.sh
          bash -n scripts/check-abi.sh
          sh -n 'package/Animal Well.sh'
          sh -n 'package/Animal Well Diagnose.sh'
          sh -n package/animalwell/diagnose.sh
          sh -n package/animalwell/test14-15-wsi.sh
          grep -Fq 'WIN32U="$RT/wine/lib/wine/x86_64-unix/win32u.so"' package/animalwell/test14-15-wsi.sh
          if grep -Fq '$RUNTIME/wine/lib/wine/x86_64-unix/win32u.so' package/animalwell/test14-15-wsi.sh; then
            echo "ERROR: stale undefined RUNTIME alias in test15 win32u guard" >&2
            exit 1
          fi

      - name: Prove ABI gate fails closed
        run: |
          set -o pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cp /bin/ls "$tmp/too-new-for-zero-ceiling"
          if MAX_GLIBC=0.0 MAX_GLIBCXX=0.0 bash scripts/check-abi.sh "$tmp" 2>&1 | tee "$tmp/negative.log"; then
            echo "ERROR: ABI checker unexpectedly accepted a deliberately impossible ceiling" >&2
            exit 1
          fi
          grep -q 'ABI check: FAIL' "$tmp/negative.log"

  build-aarch64-runtime:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      MAX_GLIBC: '2.31'
      MAX_GLIBCXX: '3.4.28'
    steps:
      - name: Install focal build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          printf '%s\n' 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl xz-utils zstd zip unzip make cmake python3 python3-pip \
            file binutils gcc libc6-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross qemu-user gcc-mingw-w64-x86-64 \
            libvulkan-dev libunwind8 libstdc++6
          python3 -m pip install --no-cache-dir cmake==3.27.9
          cmake --version
          ldd --version | head -n1

      - uses: actions/checkout@v4

      - name: Build
        run: JOBS=4 bash scripts/build_runtime.sh

      - name: Validate every shipped ELF against SpruceOS ABI ceiling
        shell: bash
        run: |
          set -o pipefail
          RT=.work/package/animalwell/runtime
          mkdir -p dist
          bash scripts/check-abi.sh "$RT" 2>&1 | tee dist/abi-report.txt

      - name: Validate formats and ARM64 loader
        shell: bash
        run: |
          set -euo pipefail
          RT=.work/package/animalwell/runtime
          file "$RT/box64/box64" "$RT/tools/vkprobe" "$RT/tools/vulkan_ext_probe_x64" "$RT/tools/d3d12_smoke.exe"
          file "$RT/box64/box64" | grep -q 'ARM aarch64'
          file "$RT/tools/vkprobe" | grep -q 'ARM aarch64'
          file "$RT/tools/vulkan_ext_probe_x64" | grep -q 'x86-64'
          file "$RT/tools/d3d12_smoke.exe" | grep -q 'PE32+'
          for f in "$RT"/box64/x64lib/*.so*; do
            file "$f"
            file "$f" | grep -q 'x86-64'
          done
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$RT/box64/box64" -v 2>&1 | tee dist/box64-qemu.log

      - name: Validate lightweight Wine prefix layout
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(pwd)/.work/package/animalwell"
          RT="$ROOT/runtime"
          T="$ROOT/prefix-template"
          P=/tmp/animalwell-ci-prefix
          rm -rf "$P"
          mkdir -p "$P/dosdevices" "$P/drive_c/windows" "$P/drive_c/users" \
            "$P/drive_c/Program Files" "$P/drive_c/Program Files (x86)" \
            "$P/drive_c/ProgramData" "$P/drive_c/windows/temp"
          cp "$T/system.reg" "$P/system.reg"
          cp "$T/user.reg" "$P/user.reg"
          cp "$T/userdef.reg" "$P/userdef.reg"
          cp "$T/.update-timestamp" "$P/.update-timestamp"
          ln -s ../drive_c "$P/dosdevices/c:"
          ln -s / "$P/dosdevices/z:"
          ln -s "$RT/wine/lib/wine/x86_64-windows" "$P/drive_c/windows/system32"
          ln -s "$RT/wine/lib/wine/i386-windows" "$P/drive_c/windows/syswow64"
          mkdir -p /tmp/animalwell-ci-user
          ln -s /tmp/animalwell-ci-user "$P/drive_c/users/root"
          test -f "$P/drive_c/windows/system32/kernel32.dll"
          WINEPREFIX="$P" WINEARCH=win64 WINEDEBUG=-all \
            WINEDLLOVERRIDES='winemenubuilder.exe=d;mscoree=d;mshtml=d' \
            "$RT/wine/bin/wine" cmd /c ver 2>&1 | tee dist/prefix-sanity.log
          grep -q 'Microsoft Windows' dist/prefix-sanity.log

      - name: Build delta-only test15 prefix patch
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-prefix-delta/animalwell
          mkdir -p "$D/prefix-template"
          cp -a .work/package/animalwell/prefix-template/. "$D/prefix-template/"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST15-PREFIX-DELTA.txt" <<'EOF'
          Delta over the previous test14/test15 field patches.

          Adds only the files that test15 needs but earlier WSI-only deltas did not ship:
          - Wine 11.18 lightweight prefix registry template
          - current test14/test15 harness

          The registry template was generated by the same runtime build and passed the
          host prefix sanity check before packaging. No Wine runtime binaries are repeated.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-prefix-delta && zip -qr ../Animal-Well-TSPS-test15-PREFIX-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-PREFIX-DELTA.zip > Animal-Well-TSPS-test15-PREFIX-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-PREFIX-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-PREFIX-DELTA.sha256

      - name: Build delta-only test15 no3d diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-no3d-delta/animalwell
          mkdir -p "$D/runtime/tools"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cp .work/package/animalwell/runtime/tools/d3d12_smoke.exe "$D/runtime/tools/d3d12_smoke.exe"
          cat >"$D/TEST15-NO3D-DELTA.txt" <<'EOF'
          Delta over the previous test15 prefix patch.

          Changed files only:
          - test14-15-wsi.sh: test15 now sets WINE_D3D_CONFIG=renderer=no3d
            so DXGI/WineD3D does not initialise its Vulkan renderer.
            Wine d3d12.dll still uses VKD3D/Vulkan independently.
          - runtime/tools/d3d12_smoke.exe: unbuffered stage markers:
              STAGE_DXGI_FACTORY_BEGIN/PASS
              STAGE_D3D12_DEVICE_BEGIN/PASS

          Re-run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-no3d-delta && zip -qr ../Animal-Well-TSPS-test15-NO3D-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-NO3D-DELTA.zip > Animal-Well-TSPS-test15-NO3D-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-NO3D-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-NO3D-DELTA.sha256

      - name: Build delta-only test15 staged diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-staged-delta/animalwell
          mkdir -p "$D/runtime/tools"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cp .work/package/animalwell/runtime/tools/d3d12_smoke.exe "$D/runtime/tools/d3d12_smoke.exe"
          cat >"$D/TEST15-STAGED-DELTA.txt" <<'EOF'
          Delta over the previous test15 NO3D patch.

          Changed files only:
          - test14-15-wsi.sh now runs five independent probes:
              load-dxgi
              load-d3d12
              factory
              device
              all
            Each probe has its own timeout and wineserver reset.
          - d3d12_smoke.exe now supports those modes and prints unbuffered
            STAGE_LOAD_DXGI_*, STAGE_LOAD_D3D12_*,
            STAGE_DXGI_FACTORY_*, and STAGE_D3D12_DEVICE_* markers.

          Re-run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-staged-delta && zip -qr ../Animal-Well-TSPS-test15-STAGED-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-STAGED-DELTA.zip > Animal-Well-TSPS-test15-STAGED-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-STAGED-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-STAGED-DELTA.sha256

      - name: Build delta-only test15 display/KMT renderer matrix
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-display-kmt-delta/animalwell
          mkdir -p "$D/runtime/tools"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cp .work/package/animalwell/runtime/tools/d3d12_smoke.exe "$D/runtime/tools/d3d12_smoke.exe"
          cat >"$D/TEST15-DISPLAY-KMT-DELTA.txt" <<'EOF'
          Delta over the previous PERSISTENT-X11 diagnostic patch.

          Changed files only:
          - test14-15-wsi.sh
            * fixes Mali wrapper debug category to wrapper+wsi+low-address-map
            * resets wineserver between probes after watchdog termination
            * adds renderer matrix: no3d, gl, vulkan
            * enables Wine d3d/x11drv tracing
            * conditionally tests D3D12CreateDevice only after a factory passes
          - runtime/tools/d3d12_smoke.exe
            * adds display-kmt mode
            * probes EnumDisplayDevicesW
            * probes D3DKMTOpenAdapterFromGdiDisplayName
            * probes D3DKMTOpenAdapterFromLuid

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-display-kmt-delta && zip -qr ../Animal-Well-TSPS-test15-DISPLAY-KMT-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-DISPLAY-KMT-DELTA.zip > Animal-Well-TSPS-test15-DISPLAY-KMT-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-DISPLAY-KMT-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-DISPLAY-KMT-DELTA.sha256

      - name: Build delta-only test15 virtual desktop diagnostic
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-vdesktop-delta/animalwell
          mkdir -p "$D/runtime/tools"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cp .work/package/animalwell/runtime/tools/d3d12_smoke.exe "$D/runtime/tools/d3d12_smoke.exe"
          cat >"$D/TEST15-VDESKTOP-DELTA.txt" <<'EOF'
          Delta over the previous DISPLAY-KMT diagnostic patch.

          Changed files only:
          - test14-15-wsi.sh
            * compares native Win32 display enumeration with Wine virtual desktop mode
            * tests vdesktop DXGI factories for no3d, gl, and vulkan
            * only proceeds to D3D12CreateDevice when the matching factory passes
          - runtime/tools/d3d12_smoke.exe
            * adds vdesktop-* modes
            * creates a 1280x720 Wine virtual desktop with DF_WINE_VIRTUAL_DESKTOP
            * switches the test thread to that desktop before display/DXGI probing
            * retries EnumDisplayDevicesW while Wine refreshes display topology

          Wine 11.18 forces update_display_cache(TRUE) when the virtual desktop
          is created and again when the thread switches into that desktop.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-vdesktop-delta && zip -qr ../Animal-Well-TSPS-test15-VDESKTOP-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-VDESKTOP-DELTA.zip > Animal-Well-TSPS-test15-VDESKTOP-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-VDESKTOP-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-VDESKTOP-DELTA.sha256

      - name: Build delta-only test15 display seed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-display-seed-delta/animalwell
          mkdir -p "$D"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST15-DISPLAY-SEED-DELTA.txt" <<'EOF'
          Delta over the previous VDESKTOP diagnostic patch.

          Changed files only:
          - test14-15-wsi.sh
            * harness_version=2026-09-28.10
            * adds Wine +system,+d3dkmt,+xrandr tracing
            * reproduces the real-Vulkan display enumeration baseline
            * temporarily points VK_ICD_FILENAMES at a guaranteed-missing ICD
              so Wine display-cache population can proceed without Vulkan GPU discovery
            * tries both native EnumDisplayDevicesW and DF_WINE_VIRTUAL_DESKTOP
              while Vulkan discovery is disabled
            * restores the real Mali wrapper and checks whether \\.\DISPLAY1
              persists in the same prefix after wineserver restart
            * only retries DXGI/D3D12 if real-Vulkan display enumeration returns

          No runtime binaries are included in this delta.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-display-seed-delta && zip -qr ../Animal-Well-TSPS-test15-DISPLAY-SEED-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-DISPLAY-SEED-DELTA.zip > Animal-Well-TSPS-test15-DISPLAY-SEED-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-DISPLAY-SEED-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-DISPLAY-SEED-DELTA.sha256

      - name: Build delta-only test15 GPU-less display seed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-display-seed-nogpu-delta/animalwell
          mkdir -p "$D"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST15-DISPLAY-SEED-NOGPU-DELTA.txt" <<'EOF'
          Delta over the previous DISPLAY-SEED diagnostic patch.

          Changed files only:
          - test14-15-wsi.sh
            * harness_version=2026-09-28.11
            * adds +wgl tracing
            * disables Vulkan ICD during the seed phase
            * shadows libEGL.so.1 and libGL.so.1 with invalid files at the
              front of LD_LIBRARY_PATH so Wine OpenGL GPU discovery fails fast
            * retries native and virtual-desktop display-cache population
            * restores the real Mali Vulkan/OpenGL paths and verifies whether
              \\.\DISPLAY1 persists in the same prefix
            * only retries DXGI/D3D12 if real-GPU display enumeration succeeds

          No runtime binaries are included in this delta.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-display-seed-nogpu-delta && zip -qr ../Animal-Well-TSPS-test15-DISPLAY-SEED-NOGPU-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-DISPLAY-SEED-NOGPU-DELTA.zip > Animal-Well-TSPS-test15-DISPLAY-SEED-NOGPU-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-DISPLAY-SEED-NOGPU-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-DISPLAY-SEED-NOGPU-DELTA.sha256

      - name: Build delta-only test15 quiet nulldrv seed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-quiet-nulldrv-seed/animalwell
          mkdir -p "$D"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST15-QUIET-NULLDRV-SEED-DELTA.txt" <<'EOF'
          Delta over the previous DISPLAY-SEED-NOGPU diagnostic patch.

          Changed file only:
          - test14-15-wsi.sh
            * harness_version=2026-09-28.12
            * keeps Vulkan and EGL/GL disabled only during one-time display seed
            * sets WINEDEBUG=-all during that seed to avoid thousands of nulldrv
              missing-entrypoint warnings and their Box64/logging overhead
            * raises native seed watchdog to 120s
            * only tries the 150s virtual-desktop seed if native seed does not
              reach STAGE_ENUM_DISPLAY_PASS
            * records elapsed seed time
            * restores normal Wine debug and real GPU libraries before verifying
              that the display topology persists

          No runtime binaries are included in this delta.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-quiet-nulldrv-seed && zip -qr ../Animal-Well-TSPS-test15-QUIET-NULLDRV-SEED-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-QUIET-NULLDRV-SEED-DELTA.zip > Animal-Well-TSPS-test15-QUIET-NULLDRV-SEED-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-QUIET-NULLDRV-SEED-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-QUIET-NULLDRV-SEED-DELTA.sha256

      - name: Build delta-only test15 same-wineserver seed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-same-wineserver-seed/animalwell
          mkdir -p "$D"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST15-SAME-WINESERVER-SEED-DELTA.txt" <<'EOF'
          Delta over the previous QUIET-NULLDRV-SEED diagnostic patch.

          Changed file only:
          - test14-15-wsi.sh
            * harness_version=2026-09-28.13
            * successful GPU-less display seed keeps the same wineserver alive
            * restores real Vulkan/OpenGL env for a fresh Wine client without
              restarting wineserver
            * verifies \\.\DISPLAY1 + D3DKMT in that same Wine session
            * if successful, immediately tests DXGI factory and D3D12 device
              while preserving the seeded wineserver
            * wineserver is killed only after the full same-session matrix

          No runtime binaries are included in this delta.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-same-wineserver-seed && zip -qr ../Animal-Well-TSPS-test15-SAME-WINESERVER-SEED-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-SAME-WINESERVER-SEED-DELTA.zip > Animal-Well-TSPS-test15-SAME-WINESERVER-SEED-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-SAME-WINESERVER-SEED-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-SAME-WINESERVER-SEED-DELTA.sha256

      - name: Build delta-only test15 D3DKMT win32u patch
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-d3dkmt-win32u-delta/animalwell
          mkdir -p "$D/runtime/wine/lib/wine/x86_64-unix" "$D/runtime/wine-patches"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cp .work/package/animalwell/runtime/wine/lib/wine/x86_64-unix/win32u.so              "$D/runtime/wine/lib/wine/x86_64-unix/win32u.so"
          cp .work/package/animalwell/runtime/wine-patches/D3DKMT-NOVULKAN.txt              "$D/runtime/wine-patches/D3DKMT-NOVULKAN.txt"
          cat >"$D/TEST15-D3DKMT-WIN32U-DELTA.txt" <<'EOF'
          Delta over the previous SAME-WINESERVER-SEED diagnostic patch.

          Changed files only:
          - test14-15-wsi.sh
            * harness_version=2026-09-28.14
            * requires the exact patched win32u.so SHA before running
          - runtime/wine/lib/wine/x86_64-unix/win32u.so
            * exact Wine 11.18/Kron4ek binary with one-byte patch
            * d3dkmt_init_vulkan first opcode changed to RET
            * disables only D3DKMT's private Vulkan instance
            * does not disable Vulkan for VKD3D/D3D12
          - runtime/wine-patches/D3DKMT-NOVULKAN.txt
            * exact original/patched SHA and symbol metadata

          Rationale:
          same-wineserver field testing proves DISPLAY1 survives and the crash occurs
          only when NtGdiDdDDIOpenAdapterFromLuid initializes D3DKMT's private Vulkan
          instance. Wine already treats a missing D3DKMT Vulkan instance as non-fatal.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          sha256sum "$D/runtime/wine/lib/wine/x86_64-unix/win32u.so"
          objdump -d --start-address=0x44940 --stop-address=0x44950             "$D/runtime/wine/lib/wine/x86_64-unix/win32u.so"
          (cd dist/test15-d3dkmt-win32u-delta && zip -qr ../Animal-Well-TSPS-test15-D3DKMT-WIN32U-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-D3DKMT-WIN32U-DELTA.zip > Animal-Well-TSPS-test15-D3DKMT-WIN32U-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-D3DKMT-WIN32U-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-D3DKMT-WIN32U-DELTA.sha256

      - name: Build script-only test15 D3DKMT win32u harness fix
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-d3dkmt-win32u-harnessfix/animalwell
          mkdir -p "$D"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cat >"$D/TEST15-D3DKMT-WIN32U-HARNESSFIX-DELTA.txt" <<'EOF'
          Delta over Animal-Well-TSPS-test15-D3DKMT-WIN32U-DELTA.zip.

          Changed file only:
          - test14-15-wsi.sh
            * harness_version=2026-09-28.15
            * fixes the fail-closed patched-win32u check to use the existing
              RT runtime root instead of the undefined RUNTIME variable

          The previous D3DKMT-WIN32U delta must already be installed because this
          delta intentionally does not repeat win32u.so. The harness still verifies
          the exact patched win32u SHA before any Wine diagnostics run.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-d3dkmt-win32u-harnessfix && zip -qr ../Animal-Well-TSPS-test15-D3DKMT-WIN32U-HARNESSFIX-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-D3DKMT-WIN32U-HARNESSFIX-DELTA.zip > Animal-Well-TSPS-test15-D3DKMT-WIN32U-HARNESSFIX-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-D3DKMT-WIN32U-HARNESSFIX-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-D3DKMT-WIN32U-HARNESSFIX-DELTA.sha256

      - name: Build delta-only test15 Vulkan bridge probe
        shell: bash
        run: |
          set -euo pipefail
          D=dist/test15-vulkan-bridge-probe/animalwell
          mkdir -p "$D/runtime/tools"
          cp package/animalwell/test14-15-wsi.sh "$D/test14-15-wsi.sh"
          chmod +x "$D/test14-15-wsi.sh"
          cp .work/package/animalwell/runtime/tools/vulkan_ext_probe_x64 "$D/runtime/tools/vulkan_ext_probe_x64"
          chmod +x "$D/runtime/tools/vulkan_ext_probe_x64"
          cat >"$D/TEST15-VULKAN-BRIDGE-PROBE-DELTA.txt" <<'EOF'
          Delta over the previous D3DKMT-WIN32U-HARNESSFIX diagnostic.

          Changed/new files only:
          - test14-15-wsi.sh
            * harness_version=2026-09-28.16
            * runs an x86-64 Vulkan loader bridge matrix before Wine
            * tests direct dlsym and vkGetInstanceProcAddr paths
            * tests count-only and fill calls separately
            * exits early when the Box64/native Vulkan bridge itself fails
          - runtime/tools/vulkan_ext_probe_x64
            * tiny x86-64 Linux probe built on Ubuntu 20.04 / glibc 2.31
            * dlopens libvulkan.so.1 and calls
              vkEnumerateInstanceExtensionProperties without Wine

          This isolates:
            x86-64 guest -> Box64 Vulkan wrapper -> native libvulkan/Mali ICD
          from WineVulkan and VKD3D.

          Run:
            ./test14-15-wsi.sh test15
          EOF
          (cd dist/test15-vulkan-bridge-probe && zip -qr ../Animal-Well-TSPS-test15-VULKAN-BRIDGE-PROBE-DELTA.zip animalwell)
          (cd dist && sha256sum Animal-Well-TSPS-test15-VULKAN-BRIDGE-PROBE-DELTA.zip > Animal-Well-TSPS-test15-VULKAN-BRIDGE-PROBE-DELTA.sha256)
          unzip -l dist/Animal-Well-TSPS-test15-VULKAN-BRIDGE-PROBE-DELTA.zip
          cat dist/Animal-Well-TSPS-test15-VULKAN-BRIDGE-PROBE-DELTA.sha256

      - name: Verify game-free artifact
        run: |
          ! find .work/package -type f \( -iname 'Animal Well.exe' -o -iname '*.nsp' -o -iname 'main' -o -iname 'sdk' \) -print -quit | grep -q .

      - uses: actions/upload-artifact@v4
